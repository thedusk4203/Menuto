name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python tools/check_architecture_baseline.py
      - run: uv run python tools/check_import_boundaries.py
      - run: uv run pytest
      - run: uv run python tools/export_openapi.py --check
      - run: uv run python tools/generate_synthetic_fixtures.py --check
      - run: uv run menuto-benchmark --output benchmark/results/ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-benchmark
          path: benchmark/results/ci.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck:client
      - run: npm run test:client
      - run: npm run build:web
